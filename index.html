<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GeoRA · Geometría espacial en Realidad Aumentada</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
  :root{
    --bg:#0f172a; --panel:#111c33; --panel2:#16233d; --line:#25344f;
    --txt:#e8edf7; --muted:#93a3bd; --acc:#4da3ff; --acc2:#ffb340; --ok:#4ade80;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  #escena{position:fixed;inset:0;z-index:0}
  canvas{display:block}
  video, #arjs-video{position:fixed!important;top:0;left:0;width:100%!important;height:100%!important;
    object-fit:cover;z-index:-1}
  /* ---------- interfaz ---------- */
  #ui{position:fixed;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
  .barra{pointer-events:auto;background:rgba(15,23,42,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .marca{font-weight:700;letter-spacing:.3px;margin-right:6px;font-size:15px}
  .marca span{color:var(--acc)}
  .chip{pointer-events:auto;border:1px solid var(--line);background:var(--panel2);color:var(--txt);
    border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap;transition:.15s}
  .chip:hover{border-color:var(--acc)}
  .chip.on{background:var(--acc);border-color:var(--acc);color:#04122a;font-weight:600}
  .chip.alt.on{background:var(--acc2);border-color:var(--acc2)}
  #abajo{pointer-events:none;display:flex;gap:10px;align-items:flex-end;justify-content:space-between;padding:10px;flex-wrap:wrap}
  .tarjeta{pointer-events:auto;background:rgba(17,28,51,.92);backdrop-filter:blur(8px);border:1px solid var(--line);
    border-radius:14px;padding:12px 14px;min-width:240px;max-width:340px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
  .tarjeta h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
  .fila{display:flex;align-items:center;gap:8px;margin:7px 0}
  .fila label{width:88px;font-size:13px;color:var(--muted)}
  .fila output{width:62px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--acc)}
  input[type=range]{flex:1;accent-color:var(--acc);height:22px}
  .form{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin:7px 0;font-size:13px}
  .form .t{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  .form .f{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:#cfe0ff;margin-top:3px;word-break:break-word}
  .form .r{font-weight:700;color:var(--ok);font-size:15px;margin-top:3px}
  .cuenta{display:flex;gap:6px;margin-top:8px}
  .cuenta div{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px;text-align:center}
  .cuenta b{display:block;font-size:17px;color:var(--acc2)}
  .cuenta small{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px}
  #aviso{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;max-width:min(460px,90vw);
    background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:none;
    box-shadow:0 20px 60px rgba(0,0,0,.6)}
  #aviso h2{margin:0 0 10px;font-size:17px}
  #aviso p{margin:0 0 12px;font-size:14px;line-height:1.5;color:var(--muted)}
  #aviso .chip{display:inline-block}
  #pista{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:12;font-size:13px;
    background:rgba(15,23,42,.9);border:1px solid var(--line);padding:8px 14px;border-radius:999px;display:none}
  @media (max-width:620px){
    .tarjeta{min-width:0;width:100%;max-width:none}
    .fila label{width:72px}
    #abajo{flex-direction:column;align-items:stretch}
    .marca{font-size:13px}
    .chip{padding:6px 10px;font-size:12px}
  }
</style>
</head>
<body>
<div id="escena"></div>

<div id="ui">
  <div class="barra">
    <div class="marca">Geo<span>RA</span></div>
    <button class="chip on" data-cuerpo="cubo">Cubo</button>
    <button class="chip" data-cuerpo="prisma">Prisma</button>
    <button class="chip" data-cuerpo="piramide">Pirámide</button>
    <button class="chip" data-cuerpo="cilindro">Cilindro</button>
    <button class="chip" data-cuerpo="cono">Cono</button>
    <span style="flex:1"></span>
    <button class="chip alt" id="btnRA">Activar RA</button>
    <button class="chip" id="btnEtiq">Medidas</button>
    <button class="chip" id="btnAyuda">?</button>
  </div>

  <div id="abajo">
    <div class="tarjeta" id="panelDim">
      <h3>Medidas del cuerpo (cm)</h3>
      <div id="sliders"></div>
      <div class="fila">
        <label style="color:var(--acc2)">Desarrollo</label>
        <input type="range" id="desdoblar" min="0" max="100" value="0">
        <output id="oDes">armado</output>
      </div>
      <button class="chip" id="btnAnim" style="width:100%;margin-top:4px">▶ Animar desarrollo plano</button>
    </div>

    <div class="tarjeta" id="panelCalc">
      <h3>Cálculo</h3>
      <div class="form"><div class="t">Área lateral</div><div class="f" id="fAl"></div><div class="r" id="rAl"></div></div>
      <div class="form"><div class="t">Área total</div><div class="f" id="fAt"></div><div class="r" id="rAt"></div></div>
      <div class="form"><div class="t">Volumen</div><div class="f" id="fV"></div><div class="r" id="rV"></div></div>
      <div class="cuenta">
        <div><b id="nC">6</b><small>Caras</small></div>
        <div><b id="nV">8</b><small>Vértices</small></div>
        <div><b id="nA">12</b><small>Aristas</small></div>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px" id="euler"></div>
    </div>
  </div>
</div>

<div id="pista">Enfoca el marcador Hiro impreso</div>

<div id="aviso">
  <h2 id="avisoT">GeoRA</h2>
  <p id="avisoP"></p>
  <button class="chip on" id="avisoOk">Entendido</button>
</div>

<script src="vendor/three.global.js"></script>
<script src="vendor/ar-threex.js"></script>
<script>
/* =====================================================================
   GeoRA — Geometría espacial en Realidad Aumentada
   Prototipo funcional. Three.js + AR.js (marcador Hiro).
   Modelo: cada cuerpo se define como una RED PLANA (net) 2D + un árbol
   de bisagras. Plegar la red = armar el cuerpo. Desplegar = desarrollo plano.
   ===================================================================== */

const T = THREE;
const GR = Math.PI/180;
const N_LADOS = 40;              // segmentos para aproximar circunferencias
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));

/* ---------------------------------------------------------------
   1. RED PLANA -> ÁRBOL DE CARAS CON BISAGRAS
   Una cara = polígono 2D [[x,z],...] en el plano de la red.
   Una bisagra = {padre, hijo, a:[x,z], b:[x,z], pliegue:radianes}
   El signo del pliegue es siempre positivo: cada cara hija gira hacia
   el interior del cuerpo (propiedad de los poliedros convexos).
   --------------------------------------------------------------- */

function poligonoMesh(poly, color, borde=true){
  const shape = new T.Shape();
  shape.moveTo(poly[0][0], poly[0][1]);
  for(let i=1;i<poly.length;i++) shape.lineTo(poly[i][0], poly[i][1]);
  shape.closePath();
  const g = new T.ShapeGeometry(shape);
  g.rotateX(Math.PI/2);                       // plano XY -> plano XZ
  const m = new T.MeshLambertMaterial({color, side:T.DoubleSide, transparent:true, opacity:.93});
  const mesh = new T.Mesh(g,m);
  const grupo = new T.Group(); grupo.add(mesh);
  if(borde){
    const pts = poly.map(p=>new T.Vector3(p[0],0,p[1]));
    pts.push(pts[0].clone());
    const lg = new T.BufferGeometry().setFromPoints(pts);
    const line = new T.Line(lg, new T.LineBasicMaterial({color:0x0b1220}));
    line.position.y = 0.0015;
    grupo.add(line);
  }
  grupo.userData.mat = m;
  return grupo;
}

// Cambio de coordenadas al marco local de una bisagra.
// t = {tx,tz,ux,uz}: origen en (tx,tz), eje X local sobre (ux,uz) unitario,
// eje Z local sobre la normal exterior (-uz, ux).
function aplicar(t, p){
  const dx=p[0]-t.tx, dz=p[1]-t.tz;
  return [ dx*t.ux + dz*t.uz, -dx*t.uz + dz*t.ux ];
}

function centroide(poly){
  let x=0,z=0; for(const p of poly){x+=p[0];z+=p[1];}
  return [x/poly.length, z/poly.length];
}

/* versión con transformación como función (permite composición sencilla) */
function construirCaraT(red, id, fn, pivotes){
  const cara = red.caras[id];
  const polyLocal = cara.poly.map(fn);
  const g = poligonoMesh(polyLocal, cara.color, cara.borde!==false);
  g.userData.id = id;

  for(const h of red.bisagras.filter(b=>b.padre===id)){
    let a = fn(h.a), b = fn(h.b);
    const cHijo = fn(centroide(red.caras[h.hijo].poly));
    let ux=b[0]-a[0], uz=b[1]-a[1];
    let L=Math.hypot(ux,uz); ux/=L; uz/=L;
    if((cHijo[0]-a[0])*(-uz) + (cHijo[1]-a[1])*(ux) < 0){ const t=a; a=b; b=t; }
    ux=b[0]-a[0]; uz=b[1]-a[1];
    L=Math.hypot(ux,uz); ux/=L; uz/=L;
    const phi = Math.atan2(-uz, ux);

    const pivot = new T.Group();
    pivot.position.set(a[0], 0, a[1]);
    pivot.rotation.order = 'YXZ';   // primero orientar la bisagra (Y), luego plegar sobre ella (X)
    pivot.rotation.y = phi;
    pivot.userData.pliegue = h.pliegue;
    pivotes.push(pivot);

    const trH = {tx:a[0], tz:a[1], ux, uz};
    const fnHijo = p => aplicar(trH, fn(p));
    pivot.add(construirCaraT(red, h.hijo, fnHijo, pivotes));
    g.add(pivot);
  }
  return g;
}

function construirRed(red){
  const pivotes = [];
  const idn = p=>[p[0],p[1]];
  const raiz = construirCaraT(red, red.raiz, idn, pivotes);
  const grupo = new T.Group();
  grupo.add(raiz);
  // centrar sobre el origen usando el centroide de la cara base
  const c = centroide(red.caras[red.raiz].poly);
  raiz.position.set(-c[0], 0, -c[1]);
  grupo.userData.pivotes = pivotes;
  grupo.userData.etiquetas = [];
  return grupo;
}

/* ---------------------------------------------------------------
   2. DEFINICIÓN DE LOS CUERPOS  (medidas en cm)
   --------------------------------------------------------------- */
const COL = { base:0x2f7dd1, lat:0x4da3ff, lat2:0x6fb6ff, tapa:0xffb340 };

function poliRegular(n, r, cx=0, cz=0, giro=0){
  const p=[];
  for(let i=0;i<n;i++){ const a=giro + i*2*Math.PI/n; p.push([cx+r*Math.cos(a), cz+r*Math.sin(a)]); }
  return p;
}

/* ángulo de pliegue entre dos caras a partir del diedro del cuerpo armado */
function pliegueDiedro(A, P1, P0, P2){
  const e = new T.Vector3().subVectors(P1,A).normalize();
  const w1 = new T.Vector3().subVectors(P0,A); w1.addScaledVector(e, -w1.dot(e));
  const w2 = new T.Vector3().subVectors(P2,A); w2.addScaledVector(e, -w2.dot(e));
  const diedro = w1.angleTo(w2);
  return Math.PI - diedro;
}

const CUERPOS = {
  cubo:{
    nombre:'Cubo', dims:[{k:'a',et:'Arista a',min:2,max:14,val:7}],
    red:d=>redPrisma(d.a,d.a,d.a),
    calc:d=>{const a=d.a;return{
      al:{f:`A<sub>L</sub> = 4·a² = 4·${a}²`, v:4*a*a},
      at:{f:`A<sub>T</sub> = 6·a² = 6·${a}²`, v:6*a*a},
      vo:{f:`V = a³ = ${a}³`, v:a*a*a}, c:6,v:8,ar:12}},
    etiq:d=>[['a = '+d.a+' cm',[0,0,d.a/2],'base'],['a = '+d.a+' cm',[d.a/2,d.a/2,0],'alto']]
  },
  prisma:{
    nombre:'Prisma rectangular',
    dims:[{k:'a',et:'Largo a',min:2,max:14,val:9},{k:'b',et:'Ancho b',min:2,max:14,val:5},{k:'h',et:'Altura h',min:2,max:14,val:7}],
    red:d=>redPrisma(d.a,d.b,d.h),
    calc:d=>{const{a,b,h}=d;return{
      al:{f:`A<sub>L</sub> = 2(a+b)·h = 2(${a}+${b})·${h}`, v:2*(a+b)*h},
      at:{f:`A<sub>T</sub> = A<sub>L</sub> + 2·a·b = ${2*(a+b)*h} + 2·${a}·${b}`, v:2*(a+b)*h+2*a*b},
      vo:{f:`V = a·b·h = ${a}·${b}·${h}`, v:a*b*h}, c:6,v:8,ar:12}},
    etiq:d=>[['a = '+d.a+' cm',[0,0,d.b/2],'base'],['b = '+d.b+' cm',[d.a/2,0,0],'base'],['h = '+d.h+' cm',[d.a/2,d.h/2,d.b/2],'alto']]
  },
  piramide:{
    nombre:'Pirámide cuadrangular',
    dims:[{k:'a',et:'Lado a',min:2,max:14,val:8},{k:'h',et:'Altura h',min:2,max:16,val:9}],
    red:d=>redPiramide(d.a,d.h),
    calc:d=>{const{a,h}=d; const ap=Math.sqrt(h*h+(a/2)*(a/2));return{
      al:{f:`A<sub>L</sub> = (P·ap)/2 = (4·${a}·${ap.toFixed(2)})/2`, v:4*a*ap/2},
      at:{f:`A<sub>T</sub> = A<sub>L</sub> + a² = ${(4*a*ap/2).toFixed(1)} + ${a}²`, v:4*a*ap/2+a*a},
      vo:{f:`V = (a²·h)/3 = (${a}²·${h})/3`, v:a*a*h/3}, c:5,v:5,ar:8,
      extra:`apotema ap = √(h² + (a/2)²) = ${ap.toFixed(2)} cm`}},
    etiq:d=>[['a = '+d.a+' cm',[0,0,d.a/2],'base'],['h = '+d.h+' cm',[0,d.h/2,0],'alto']]
  },
  cilindro:{
    nombre:'Cilindro',
    dims:[{k:'r',et:'Radio r',min:1,max:8,val:4},{k:'h',et:'Altura h',min:2,max:16,val:9}],
    red:d=>redCilindro(d.r,d.h),
    calc:d=>{const{r,h}=d;return{
      al:{f:`A<sub>L</sub> = 2·π·r·h = 2π·${r}·${h}`, v:2*Math.PI*r*h},
      at:{f:`A<sub>T</sub> = 2πr·h + 2πr² = ${(2*Math.PI*r*h).toFixed(1)} + ${(2*Math.PI*r*r).toFixed(1)}`, v:2*Math.PI*r*h+2*Math.PI*r*r},
      vo:{f:`V = π·r²·h = π·${r}²·${h}`, v:Math.PI*r*r*h}, c:'3*',v:'0*',ar:'2*',
      extra:'* Superficie curva: no es poliedro, no cumple la fórmula de Euler.'}},
    etiq:d=>[['r = '+d.r+' cm',[d.r/2,0,0],'base'],['h = '+d.h+' cm',[d.r,d.h/2,0],'alto']]
  },
  cono:{
    nombre:'Cono',
    dims:[{k:'r',et:'Radio r',min:1,max:8,val:4},{k:'h',et:'Altura h',min:2,max:16,val:10}],
    red:d=>redCono(d.r,d.h),
    calc:d=>{const{r,h}=d; const g=Math.sqrt(r*r+h*h);return{
      al:{f:`A<sub>L</sub> = π·r·g = π·${r}·${g.toFixed(2)}`, v:Math.PI*r*g},
      at:{f:`A<sub>T</sub> = πrg + πr² = ${(Math.PI*r*g).toFixed(1)} + ${(Math.PI*r*r).toFixed(1)}`, v:Math.PI*r*g+Math.PI*r*r},
      vo:{f:`V = (π·r²·h)/3 = (π·${r}²·${h})/3`, v:Math.PI*r*r*h/3}, c:'2*',v:'1*',ar:'1*',
      extra:`generatriz g = √(r² + h²) = ${g.toFixed(2)} cm  ·  * superficie curva`}},
    etiq:d=>[['r = '+d.r+' cm',[d.r/2,0,0],'base'],['h = '+d.h+' cm',[0,d.h/2,0],'alto'],
             ['g',[d.r/2,d.h/2,0],'alto']]
  }
};

/* ---- redes planas ---- */
function redPrisma(a,b,h){
  const base = [[0,0],[a,0],[a,b],[0,b]];
  const caras = { base:{poly:base, color:COL.base} };
  const bisagras = [];
  const aristas = [[[0,0],[a,0],a],[[a,0],[a,b],b],[[a,b],[0,b],a],[[0,b],[0,0],b]];
  aristas.forEach((e,i)=>{
    const L=e[2];
    // la cara lateral se dibuja fuera del rectángulo, perpendicular a la arista
    const ax=e[0][0], az=e[0][1], bx=e[1][0], bz=e[1][1];
    let ux=(bx-ax)/L, uz=(bz-az)/L;
    let ox=-uz, oz=ux;                                   // normal
    const cb=[a/2,b/2];
    if(((ax+bx)/2-cb[0])*ox + ((az+bz)/2-cb[1])*oz < 0){ ox=-ox; oz=-oz; }
    const poly=[[ax,az],[bx,bz],[bx+ox*h,bz+oz*h],[ax+ox*h,az+oz*h]];
    caras['lat'+i]={poly, color: i%2? COL.lat2:COL.lat};
    bisagras.push({padre:'base', hijo:'lat'+i, a:e[0], b:e[1], pliegue:Math.PI/2});
    if(i===0){ // tapa colgando de la primera cara lateral
      const p1=[bx+ox*h,bz+oz*h], p0=[ax+ox*h,az+oz*h];
      caras.tapa={poly:[p0,p1,[p1[0]+ox*b,p1[1]+oz*b],[p0[0]+ox*b,p0[1]+oz*b]], color:COL.tapa};
      bisagras.push({padre:'lat0', hijo:'tapa', a:p0, b:p1, pliegue:Math.PI/2});
    }
  });
  return {caras, bisagras, raiz:'base'};
}

function redPiramide(a,h){
  const base=[[0,0],[a,0],[a,a],[0,a]];
  const ap=Math.sqrt(h*h+(a/2)*(a/2));      // apotema lateral (altura del triángulo)
  const caras={base:{poly:base,color:COL.base}}, bisagras=[];
  const arist=[[[0,0],[a,0]],[[a,0],[a,a]],[[a,a],[0,a]],[[0,a],[0,0]]];
  const cb=[a/2,a/2];
  arist.forEach((e,i)=>{
    const ax=e[0][0],az=e[0][1],bx=e[1][0],bz=e[1][1];
    const L=Math.hypot(bx-ax,bz-az); const ux=(bx-ax)/L, uz=(bz-az)/L;
    let ox=-uz,oz=ux;
    if(((ax+bx)/2-cb[0])*ox+((az+bz)/2-cb[1])*oz<0){ox=-ox;oz=-oz;}
    const mx=(ax+bx)/2, mz=(az+bz)/2;
    caras['lat'+i]={poly:[[ax,az],[bx,bz],[mx+ox*ap, mz+oz*ap]], color:i%2?COL.lat2:COL.lat};
    bisagras.push({padre:'base',hijo:'lat'+i,a:e[0],b:e[1],pliegue:Math.PI-Math.atan2(h,a/2)});
  });
  return {caras,bisagras,raiz:'base'};
}

function redCilindro(r,h){
  const n=N_LADOS;
  const base=poliRegular(n,r);
  const s=2*r*Math.sin(Math.PI/n);           // lado del polígono
  const caras={base:{poly:base,color:COL.base}}, bisagras=[];
  // la banda lateral se despliega hacia -z a partir de la arista 0
  const A=base[0], B=base[1];
  const ux=(B[0]-A[0])/s, uz=(B[1]-A[1])/s;
  let ox=-uz, oz=ux;
  const cb=[0,0];
  if(((A[0]+B[0])/2-cb[0])*ox+((A[1]+B[1])/2-cb[1])*oz<0){ox=-ox;oz=-oz;}
  for(let i=0;i<n;i++){
    const p0=[A[0]+ux*s*i, A[1]+uz*s*i];
    const p1=[A[0]+ux*s*(i+1), A[1]+uz*s*(i+1)];
    const q1=[p1[0]+ox*h, p1[1]+oz*h], q0=[p0[0]+ox*h, p0[1]+oz*h];
    caras['lat'+i]={poly:[p0,p1,q1,q0], color:COL.lat, borde:false};
    if(i===0) bisagras.push({padre:'base',hijo:'lat0',a:A,b:B,pliegue:Math.PI/2});
    else bisagras.push({padre:'lat'+(i-1),hijo:'lat'+i,a:p0,b:q0,pliegue:2*Math.PI/n});
  }
  // tapa: polígono regular colgando del borde superior de lat0
  const t0=[A[0]+ox*h, A[1]+oz*h], t1=[B[0]+ox*h, B[1]+oz*h];
  const ang0=Math.atan2(t1[1]-t0[1], t1[0]-t0[0]);
  const cxz=[ (t0[0]+t1[0])/2 + ox*(r*Math.cos(Math.PI/n)), (t0[1]+t1[1])/2 + oz*(r*Math.cos(Math.PI/n)) ];
  const giro=Math.atan2(t0[1]-cxz[1], t0[0]-cxz[0]);
  caras.tapa={poly:poliRegular(n,r,cxz[0],cxz[1],giro), color:COL.tapa};
  bisagras.push({padre:'lat0',hijo:'tapa',a:t0,b:t1,pliegue:Math.PI/2});
  return {caras,bisagras,raiz:'base'};
}

function redCono(r,h){
  const n=N_LADOS;
  const base=poliRegular(n,r);
  const s=2*r*Math.sin(Math.PI/n);
  const apo=r*Math.cos(Math.PI/n);
  const ha=Math.sqrt(h*h+apo*apo);                // altura del triángulo lateral
  const g=Math.sqrt(h*h+r*r);                     // generatriz
  const caras={base:{poly:base,color:COL.base}}, bisagras=[];
  const A=base[0], B=base[1];
  const ux=(B[0]-A[0])/s, uz=(B[1]-A[1])/s;
  let ox=-uz,oz=ux;
  if(((A[0]+B[0])/2)*ox+((A[1]+B[1])/2)*oz<0){ox=-ox;oz=-oz;}
  // vértice del sector (ápice desplegado)
  const mx=(A[0]+B[0])/2, mz=(A[1]+B[1])/2;
  const V=[mx+ox*ha, mz+oz*ha];
  const dAng=2*Math.asin(s/(2*g));                 // apertura de cada triángulo en el sector
  // pliegue entre triángulos laterales consecutivos (diedro del cuerpo armado)
  const P=(k)=>new T.Vector3(r*Math.cos(k*2*Math.PI/n), 0, r*Math.sin(k*2*Math.PI/n));
  const APEX=new T.Vector3(0,h,0);
  const plChain=pliegueDiedro(APEX,P(1),P(0),P(2));
  let a0=[...A], b0=[...B];
  for(let i=0;i<n;i++){
    caras['lat'+i]={poly:[a0,b0,V], color:COL.lat, borde:false};
    if(i===0) bisagras.push({padre:'base',hijo:'lat0',a:A,b:B,pliegue:Math.PI-Math.atan2(h,apo)});
    else bisagras.push({padre:'lat'+(i-1),hijo:'lat'+i,a:a0,b:V,pliegue:plChain});
    // el siguiente triángulo se obtiene girando alrededor de V
    const rot=(p,ang)=>{const dx=p[0]-V[0],dz=p[1]-V[1],c=Math.cos(ang),si=Math.sin(ang);
      return [V[0]+dx*c-dz*si, V[1]+dx*si+dz*c];};
    let sentido=dAng;
    // probamos el sentido que aleja del polígono base
    const test=rot(b0,dAng);
    if(Math.hypot(test[0],test[1])<Math.hypot(rot(b0,-dAng)[0],rot(b0,-dAng)[1])) sentido=-dAng;
    a0=b0.slice(); b0=rot(b0,sentido);
  }
  return {caras,bisagras,raiz:'base'};
}

/* ---------------------------------------------------------------
   3. ESCENA
   --------------------------------------------------------------- */
const cont = document.getElementById('escena');
const renderer = new T.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
cont.appendChild(renderer.domElement);

const escena = new T.Scene();
escena.add(new T.HemisphereLight(0xffffff, 0x334455, 1.15));
const dir = new T.DirectionalLight(0xffffff, .85); dir.position.set(3,6,4); escena.add(dir);

const fondo = new T.Mesh(new T.PlaneGeometry(200,200),
  new T.MeshBasicMaterial({color:0x0b1220}));
fondo.rotation.x=-Math.PI/2; fondo.position.y=-0.001; escena.add(fondo);
const grid = new T.GridHelper(20,20,0x2b3d5c,0x1b2942); escena.add(grid);

const camEsc = new T.PerspectiveCamera(45, innerWidth/innerHeight, .01, 1000);
const raizEsc = new T.Group(); escena.add(raizEsc);
const raizMarca = new T.Group(); raizMarca.visible=false; escena.add(raizMarca);
const camAR = new T.Camera();

let modoRA = false;
let contenido = new T.Group(); raizEsc.add(contenido);

/* --- órbita simple (modo escritorio) --- */
const orb = {theta:-0.9, phi:1.12, dist:3.9, tx:0, ty:.62};
function actualizarCam(){
  const p=clamp(orb.phi, .12, Math.PI-.12);
  camEsc.position.set(
    orb.tx + orb.dist*Math.sin(p)*Math.cos(orb.theta),
    orb.ty + orb.dist*Math.cos(p),
    orb.dist*Math.sin(p)*Math.sin(orb.theta));
  camEsc.lookAt(orb.tx, orb.ty, 0);
}
let arr=false, lx=0, ly=0;
const dom=renderer.domElement;
dom.addEventListener('pointerdown',e=>{if(modoRA)return;arr=true;lx=e.clientX;ly=e.clientY;});
addEventListener('pointerup',()=>arr=false);
addEventListener('pointermove',e=>{
  if(!arr||modoRA)return;
  orb.theta -= (e.clientX-lx)*.008; orb.phi -= (e.clientY-ly)*.008;
  orb.phi=clamp(orb.phi,.12,Math.PI-.12);
  lx=e.clientX; ly=e.clientY; actualizarCam();
});
dom.addEventListener('wheel',e=>{if(modoRA)return;e.preventDefault();
  orb.dist=clamp(orb.dist*(1+Math.sign(e.deltaY)*.1),1.2,14); actualizarCam();},{passive:false});
let pinch=0;
dom.addEventListener('touchmove',e=>{
  if(modoRA||e.touches.length!==2)return;
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  if(pinch) { orb.dist=clamp(orb.dist*(pinch/d),1.2,14); actualizarCam(); }
  pinch=d;
},{passive:true});
dom.addEventListener('touchend',()=>pinch=0);
actualizarCam();

/* ---------------------------------------------------------------
   4. ETIQUETAS DE MEDIDA (sprites de canvas)
   --------------------------------------------------------------- */
function etiqueta(texto, color='#ffb340'){
  const c=document.createElement('canvas'); const x=c.getContext('2d');
  const f=44; x.font=`600 ${f}px system-ui,sans-serif`;
  const w=x.measureText(texto).width+30;
  c.width=w; c.height=f+26;
  x.font=`600 ${f}px system-ui,sans-serif`;
  x.fillStyle='rgba(10,18,34,.85)';
  x.beginPath(); x.roundRect(0,0,c.width,c.height,16); x.fill();
  x.strokeStyle=color; x.lineWidth=3; x.stroke();
  x.fillStyle=color; x.textBaseline='middle'; x.fillText(texto,15,c.height/2+2);
  const tex=new T.CanvasTexture(c); tex.anisotropy=4;
  const sp=new T.Sprite(new T.SpriteMaterial({map:tex, transparent:true, depthTest:false}));
  sp.scale.set(c.width/c.height*0.16, 0.16, 1);
  sp.renderOrder=999;
  return sp;
}

/* ---------------------------------------------------------------
   5. ESTADO Y CONSTRUCCIÓN
   --------------------------------------------------------------- */
let cuerpoActual='cubo', dims={}, pivotes=[], etiquetasOn=true, tDes=1; // 1 = armado
let grupoCuerpo=null, spriteEtiq=[];

function reconstruir(){
  const def=CUERPOS[cuerpoActual];
  if(grupoCuerpo){ contenido.remove(grupoCuerpo); }
  const red=def.red(dims);
  grupoCuerpo=construirRed(red);
  pivotes=grupoCuerpo.userData.pivotes;

  // escala: el cuerpo armado cabe en ~1.3 unidades (1 unidad = ancho del marcador)
  const dmax=Math.max(...Object.values(dims));
  const esc=1.3/Math.max(dmax, 6);
  grupoCuerpo.scale.setScalar(esc);

  // etiquetas de medida
  spriteEtiq.forEach(s=>s.parent&&s.parent.remove(s)); spriteEtiq=[];
  (def.etiq?def.etiq(dims):[]).forEach(([txt,pos])=>{
    const s=etiqueta(txt); s.position.set(pos[0]*esc, pos[1]*esc+.06, pos[2]*esc);
    grupoCuerpo.add(s); spriteEtiq.push(s);
  });

  contenido.add(grupoCuerpo);
  aplicarDespliegue();
  actualizarPanel();
}

function aplicarDespliegue(){
  for(const p of pivotes) p.rotation.x = -p.userData.pliegue * tDes;
  // la red plana ocupa mucho más que el cuerpo armado: se reduce la escala al desplegar
  contenido.scale.setScalar(1/(1+(1-tDes)*0.95));
  const vis = etiquetasOn && tDes>.85;
  spriteEtiq.forEach(s=>{ s.visible=vis; s.material.opacity=clamp((tDes-.85)/.15,0,1); });
}

function fmt(n){ return (Math.round(n*100)/100).toLocaleString('es-NI'); }

function actualizarPanel(){
  const def=CUERPOS[cuerpoActual], r=def.calc(dims);
  document.getElementById('fAl').innerHTML=r.al.f;
  document.getElementById('rAl').textContent=fmt(r.al.v)+' cm²';
  document.getElementById('fAt').innerHTML=r.at.f;
  document.getElementById('rAt').textContent=fmt(r.at.v)+' cm²';
  document.getElementById('fV').innerHTML=r.vo.f;
  document.getElementById('rV').textContent=fmt(r.vo.v)+' cm³';
  document.getElementById('nC').textContent=r.c;
  document.getElementById('nV').textContent=r.v;
  document.getElementById('nA').textContent=r.ar;
  const eu=document.getElementById('euler');
  if(typeof r.c==='number') eu.innerHTML=(r.extra?r.extra+'<br>':'')+`Euler: C + V − A = ${r.c} + ${r.v} − ${r.ar} = <b style="color:var(--ok)">${r.c+r.v-r.ar}</b>`;
  else eu.textContent=r.extra||'';
}

/* --- sliders de dimensiones --- */
function montarSliders(){
  const def=CUERPOS[cuerpoActual], cont=document.getElementById('sliders');
  cont.innerHTML=''; dims={};
  def.dims.forEach(d=>{
    dims[d.k]=d.val;
    const fila=document.createElement('div'); fila.className='fila';
    fila.innerHTML=`<label>${d.et}</label>
      <input type="range" min="${d.min}" max="${d.max}" step="1" value="${d.val}">
      <output>${d.val} cm</output>`;
    const inp=fila.querySelector('input'), out=fila.querySelector('output');
    inp.addEventListener('input',()=>{ dims[d.k]=+inp.value; out.textContent=inp.value+' cm'; reconstruir(); });
    cont.appendChild(fila);
  });
}

/* --- controles --- */
document.querySelectorAll('[data-cuerpo]').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('[data-cuerpo]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); cuerpoActual=b.dataset.cuerpo;
    montarSliders(); reconstruir();
  });
});
const sDes=document.getElementById('desdoblar'), oDes=document.getElementById('oDes');
sDes.addEventListener('input',()=>{
  tDes=1-sDes.value/100; aplicarDespliegue();
  oDes.textContent = sDes.value==0?'armado':(sDes.value==100?'red plana':sDes.value+'%');
});
let anim=null;
document.getElementById('btnAnim').addEventListener('click',()=>{
  if(anim){cancelAnimationFrame(anim);anim=null;}
  const t0=performance.now(), dur=3200, desde=+sDes.value;
  const paso=()=>{
    const k=(performance.now()-t0)/dur;
    if(k>=1){anim=null;return;}
    const v = desde<50 ? 100*Math.sin(k*Math.PI) : 100-100*Math.sin(k*Math.PI);
    sDes.value=v; sDes.dispatchEvent(new Event('input'));
    anim=requestAnimationFrame(paso);
  };
  paso();
});
document.getElementById('btnEtiq').addEventListener('click',e=>{
  etiquetasOn=!etiquetasOn; e.target.classList.toggle('on',etiquetasOn); aplicarDespliegue();
});
document.getElementById('btnEtiq').classList.add('on');

function mostrarAviso(t,p){
  document.getElementById('avisoT').textContent=t;
  document.getElementById('avisoP').innerHTML=p;
  document.getElementById('aviso').style.display='block';
}
document.getElementById('avisoOk').addEventListener('click',()=>document.getElementById('aviso').style.display='none');
document.getElementById('btnAyuda').addEventListener('click',()=>mostrarAviso('Cómo se usa',
  '<b>1.</b> Imprime el marcador (archivo <i>marcador.html</i>) en una hoja.<br>'+
  '<b>2.</b> Pulsa <i>Activar RA</i> y permite el uso de la cámara.<br>'+
  '<b>3.</b> Enfoca el marcador: el cuerpo aparece sobre el papel.<br>'+
  '<b>4.</b> Mueve el control <i>Desarrollo</i> para desplegar la figura en su red plana.<br><br>'+
  'Sin cámara funciona igual en modo escritorio: arrastra para girar y usa la rueda para acercar.'));

/* ---------------------------------------------------------------
   6. REALIDAD AUMENTADA
   --------------------------------------------------------------- */
let arSource=null, arContext=null;
function activarRA(){
  if(!window.isSecureContext){
    mostrarAviso('Se necesita HTTPS',
      'Los navegadores solo permiten usar la cámara en páginas servidas por <b>https://</b> o desde <b>localhost</b>. '+
      'Publica la carpeta en GitHub Pages (o ejecútala con <i>python3 -m http.server</i>) y vuelve a intentar. '+
      'Mientras tanto puedes usar el modo escritorio.');
    return;
  }
  arSource=new THREEx.ArToolkitSource({sourceType:'webcam', sourceWidth:640, sourceHeight:480,
    displayWidth:innerWidth, displayHeight:innerHeight});
  arSource.init(()=>{ setTimeout(ajustarAR,300); },
    ()=>mostrarAviso('Sin acceso a la cámara','No se pudo abrir la cámara. Revisa los permisos del navegador.'));

  arContext=new THREEx.ArToolkitContext({
    cameraParametersUrl:'data/camera_para.dat',
    detectionMode:'mono', maxDetectionRate:30, canvasWidth:640, canvasHeight:480});
  arContext.init(()=>camAR.projectionMatrix.copy(arContext.getProjectionMatrix()));

  new THREEx.ArMarkerControls(arContext, raizMarca, {
    type:'pattern', patternUrl:'data/patt.hiro', changeMatrixMode:'modelViewMatrix', smooth:true,
    smoothCount:5, smoothTolerance:.01, smoothThreshold:2});

  modoRA=true;
  raizMarca.visible=true; raizEsc.visible=false;
  raizMarca.add(contenido);
  grid.visible=false; fondo.visible=false;
  document.getElementById('pista').style.display='block';
  document.getElementById('btnRA').textContent='Salir de RA';
  document.getElementById('btnRA').classList.add('on');
}
function salirRA(){
  modoRA=false;
  if(arSource&&arSource.domElement&&arSource.domElement.srcObject){
    arSource.domElement.srcObject.getTracks().forEach(t=>t.stop());
    arSource.domElement.remove();
  }
  arSource=null; arContext=null;
  raizEsc.add(contenido); raizMarca.visible=false; raizEsc.visible=true;
  grid.visible=true; fondo.visible=true;
  document.getElementById('pista').style.display='none';
  document.getElementById('btnRA').textContent='Activar RA';
  document.getElementById('btnRA').classList.remove('on');
}
document.getElementById('btnRA').addEventListener('click',()=>modoRA?salirRA():activarRA());

function ajustarAR(){
  if(!arSource)return;
  arSource.onResizeElement();
  arSource.copyElementSizeTo(renderer.domElement);
  if(arContext&&arContext.arController!==null) arSource.copyElementSizeTo(arContext.arController.canvas);
}

/* ---------------------------------------------------------------
   7. BUCLE
   --------------------------------------------------------------- */
addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  camEsc.aspect=innerWidth/innerHeight; camEsc.updateProjectionMatrix();
  actualizarCam(); ajustarAR();
});

let giro=0, girar=true;
function bucle(){
  requestAnimationFrame(bucle);
  if(modoRA){
    if(arSource&&arSource.ready) arContext.update(arSource.domElement);
    raizMarca.visible = raizMarca.children.length>0 && raizMarca.visible;
    renderer.render(escena, camAR);
  }else{
    if(girar) giro+=0.0022; raizEsc.rotation.y=giro;
    renderer.render(escena, camEsc);
  }
}

montarSliders();
reconstruir();
bucle();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
window.__geoRA = { setCuerpo:(c)=>{cuerpoActual=c;montarSliders();reconstruir();},
                   setDespliegue:(v)=>{tDes=1-v;aplicarDespliegue();},
                   setOrb:(t,p,d)=>{orb.theta=t;orb.phi=p;orb.dist=d;actualizarCam();},
                   pararGiro:()=>{girar=false;giro=0;raizEsc.rotation.y=0;},
  dump:()=>{ escena.updateMatrixWorld(true); const r=[];
    grupoCuerpo.traverse(o=>{ if(o.userData && o.userData.id){
      const bb=new T.Box3().setFromObject(o);
      r.push({id:o.userData.id, min:bb.min.toArray().map(x=>+x.toFixed(3)), max:bb.max.toArray().map(x=>+x.toFixed(3))});
    }});
    const bb=new T.Box3().setFromObject(grupoCuerpo);
    return {total:{min:bb.min.toArray().map(x=>+x.toFixed(3)),max:bb.max.toArray().map(x=>+x.toFixed(3))}, caras:r}; } };
</script>
